version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/undercooked
      - ME_CONFIG_BASICAUTH=false

  backend:
    build: ./backend
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/undercooked
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - /workspace/backend/node_modules
    working_dir: /workspace/backend
    command: npm run dev
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
    working_dir: /workspace/frontend
    command: npm run dev -- --host --port 5173
    depends_on:
      - backend

volumes:
  mongo-data:
